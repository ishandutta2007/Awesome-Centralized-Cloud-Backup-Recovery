<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#071329"/>
      <stop offset="100%" stop-color="#0d1b3a"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Radial Glow filters -->
    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-intense" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulse-node {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 12px #3b82f6); }
    }
    @keyframes dash-flow {
      from { stroke-dashoffset: 100; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes float-cloud {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes rotate-ring {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes shimmer-bar {
      0% { opacity: 0.3; }
      50% { opacity: 0.9; }
      100% { opacity: 0.3; }
    }

    .bg-grid { fill: url(#cyber-grid); }
    .cloud-icon { animation: float-cloud 4s ease-in-out infinite; transform-origin: center; }
    .pulse-ring { animation: pulse-node 3s ease-in-out infinite; transform-origin: center; }
    .flow-line { stroke-dasharray: 8 6; animation: dash-flow 2s linear infinite; }
    .rotating-gear { animation: rotate-ring 20s linear infinite; transform-origin: 1060px 190px; }
    .shimmer-text { animation: shimmer-bar 4s ease-in-out infinite; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="380" fill="url(#bg-grad)"/>
  <rect width="1200" height="380" class="bg-grid"/>

  <!-- Background Dynamic Network Graphic Elements (Kept behind text) -->
  <g opacity="0.35">
    <!-- Connecting network lines -->
    <path d="M 100 280 Q 250 320 400 280 T 700 300 T 1000 250" fill="none" stroke="#3b82f6" stroke-width="1.5" class="flow-line"/>
    <path d="M 150 90 Q 350 40 600 80 T 1050 100" fill="none" stroke="#8b5cf6" stroke-width="1.5" class="flow-line"/>

    <!-- Subtle Background Glow Orbs -->
    <circle cx="200" cy="190" r="120" fill="#3b82f6" opacity="0.12" filter="url(#glow-intense)"/>
    <circle cx="950" cy="190" r="140" fill="#8b5cf6" opacity="0.1" filter="url(#glow-intense)"/>
  </g>

  <!-- Foreground Title Card Overlay -->
  <rect x="50" y="40" width="1100" height="300" rx="20" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" filter="url(#glow-light)"/>
  <rect x="50" y="40" width="1100" height="3" fill="url(#primary-glow)"/>

  <!-- Left Cloud & Shield Visual Icon -->
  <g class="cloud-icon" transform="translate(100, 110)">
    <!-- Outer Pulsing Ring -->
    <circle cx="70" cy="80" r="65" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.4" class="pulse-ring"/>
    
    <!-- Shield Container -->
    <path d="M 70 20 L 120 40 V 85 C 120 115 70 140 70 140 C 70 140 20 115 20 85 V 40 Z" fill="#1e293b" stroke="url(#primary-glow)" stroke-width="3" filter="url(#glow-light)"/>
    
    <!-- Cloud Icon Inside Shield -->
    <path d="M 50 85 C 45 85 40 80 40 75 C 40 70 44 66 49 65 C 51 58 57 53 65 53 C 73 53 80 58 82 65 C 87 66 90 70 90 75 C 90 80 86 85 80 85 Z" fill="#38bdf8"/>
    
    <!-- Checkmark inside Shield -->
    <path d="M 58 80 L 67 89 L 84 70" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Center-Left Text Area (FOREGROUND - Crisp High Contrast Readability) -->
  <g transform="translate(250, 0)">
    <!-- Top Pill Badge -->
    <rect x="0" y="80" width="340" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="15" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">
      ☁️ CENTRALIZED CLOUD DATA PROTECTION
    </text>

    <!-- Main Title -->
    <text x="0" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Cloud Backup &amp; Recovery
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Curated directory of SaaS Enterprise Data Platforms &amp; Open-Source Engines
    </text>

    <!-- Feature Tag Pills -->
    <g transform="translate(0, 225)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="32" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="12" y="21" font-family="sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">🛡️ Cyber Recovery</text>

      <!-- Pill 2 -->
      <rect x="172" y="0" width="170" height="32" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="184" y="21" font-family="sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">🔐 Immutable Storage</text>

      <!-- Pill 3 -->
      <rect x="354" y="0" width="180" height="32" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="366" y="21" font-family="sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">⚡ Open-Source Backup</text>
    </g>

    <text x="0" y="295" font-family="sans-serif" font-size="13" font-weight="500" fill="#64748b">
      Updated October 2026 • Verified Commercial Pricing &amp; Open Source Metrics
    </text>
  </g>

  <!-- Right Decorative Network Graph (Kept safely on right side) -->
  <g transform="translate(980, 190)" class="cloud-icon">
    <!-- Rotating Tech Gear -->
    <circle cx="80" cy="0" r="50" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" class="rotating-gear"/>
    <circle cx="80" cy="0" r="30" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/>
    <text x="80" y="6" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#a855f7">💾</text>
  </g>
</svg>
